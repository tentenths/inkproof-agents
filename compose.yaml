# One container per agent, plus an egress proxy.
#
# Agents sit on an internal network with no route to the internet. The only
# way out is the proxy, which allows a short list of domains
# (docker/proxy/allowed-domains.txt).
#
# Each agent clones its own repository from GitHub into its workspace volume.
# working_dir stays at /workspace: if it named the repository directory,
# Docker would create that directory as root and the agent couldn't clone
# into it.
# What it may write to is decided by its GitHub tokens (secrets/<agent>/) and
# by the rulesets on each repository, not by mounts.
# control/ is mounted read-only, so only the human can pause agents
# (scripts/pause.sh, scripts/resume.sh).
#
# To add an agent: copy a service block, add its volumes and secrets, a role
# file and a devcontainer.json, and create its tokens.

name: inkproof-agents

x-agent: &agent
  build:
    context: ./docker/agent
    args:
      USER_UID: ${HOST_UID:-1000}
      USER_GID: ${HOST_GID:-1000}
  init: true
  command: ["/usr/local/bin/agent-init"]
  networks: [internal]
  depends_on: [proxy]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &agent-env
    HTTPS_PROXY: http://proxy:3128
    HTTP_PROXY: http://proxy:3128
    https_proxy: http://proxy:3128
    http_proxy: http://proxy:3128
    NO_PROXY: localhost,127.0.0.1
    no_proxy: localhost,127.0.0.1
    DISABLE_AUTOUPDATER: "1"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    GH_OWNER: ${GH_OWNER:?set GH_OWNER in .env}
    TRUSTED_AUTHORS: ${MACHINE_USER:?set MACHINE_USER in .env} ${HUMAN_USER:?set HUMAN_USER in .env}
    GIT_AUTHOR_EMAIL: ${MACHINE_EMAIL:?set MACHINE_EMAIL in .env}
    GIT_COMMITTER_EMAIL: ${MACHINE_EMAIL}
    REPO_PREFIX: ${REPO_PREFIX:?set REPO_PREFIX in .env}
    HUMAN_USER: ${HUMAN_USER}
    # watch-work: how often to poll GitHub (seconds), how many runs each agent
    # may start per day (UTC), and how long a run may stay busy unattended.
    POLL_INTERVAL: ${POLL_INTERVAL:-300}
    MAX_RUNS_PER_DAY: ${MAX_RUNS_PER_DAY:-20}
    MAX_RUN_MINUTES: ${MAX_RUN_MINUTES:-240}

services:
  proxy:
    image: ubuntu/squid:latest   # replace with a specific tag or digest once you've checked it
    networks: [internal, egress]
    volumes:
      - ./docker/proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./docker/proxy/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    restart: unless-stopped

  coordinator:
    <<: *agent
    hostname: coordinator
    working_dir: /workspace
    environment:
      <<: *agent-env
      AGENT_NAME: coordinator
      AGENT_REPO: inkproof-coordination
      GIT_AUTHOR_NAME: coordinator agent
      GIT_COMMITTER_NAME: coordinator agent
    secrets:
      - { source: coordinator-write, target: write_token }
      - { source: coordinator-read, target: read_token }
    volumes:
      - ./roles/coordinator.md:/etc/claude-code/CLAUDE.md:ro
      - ./control:/etc/inkproof/control:ro
      - work-coordinator:/workspace
      - claude-agents:/home/agent/.claude
      - elan-shared:/home/agent/.elan

  core:
    <<: *agent
    hostname: core
    working_dir: /workspace
    environment:
      <<: *agent-env
      AGENT_NAME: core
      AGENT_REPO: inkproof-core
      GIT_AUTHOR_NAME: core agent
      GIT_COMMITTER_NAME: core agent
    secrets:
      - { source: core-write, target: write_token }
      - { source: core-read, target: read_token }
    volumes:
      - ./roles/core.md:/etc/claude-code/CLAUDE.md:ro
      - ./control:/etc/inkproof/control:ro
      - work-core:/workspace
      - claude-agents:/home/agent/.claude
      - elan-shared:/home/agent/.elan

  scale:
    <<: *agent
    hostname: scale
    working_dir: /workspace
    environment:
      <<: *agent-env
      AGENT_NAME: scale
      AGENT_REPO: inkproof-scale
      GIT_AUTHOR_NAME: scale agent
      GIT_COMMITTER_NAME: scale agent
    secrets:
      - { source: scale-write, target: write_token }
      - { source: scale-read, target: read_token }
    volumes:
      - ./roles/scale.md:/etc/claude-code/CLAUDE.md:ro
      - ./control:/etc/inkproof/control:ro
      - work-scale:/workspace
      - claude-agents:/home/agent/.claude
      - elan-shared:/home/agent/.elan

  consumer-metrics:
    <<: *agent
    hostname: consumer-metrics
    working_dir: /workspace
    environment:
      <<: *agent-env
      AGENT_NAME: consumer-metrics
      AGENT_REPO: inkproof-consumer-metrics
      GIT_AUTHOR_NAME: consumer-metrics agent
      GIT_COMMITTER_NAME: consumer-metrics agent
    secrets:
      - { source: consumer-metrics-write, target: write_token }
      - { source: consumer-metrics-read, target: read_token }
    volumes:
      - ./roles/consumer-metrics.md:/etc/claude-code/CLAUDE.md:ro
      - ./control:/etc/inkproof/control:ro
      - work-consumer-metrics:/workspace
      - claude-agents:/home/agent/.claude
      - elan-shared:/home/agent/.elan

# Tokens appear inside each container at /run/secrets/write_token and
# /run/secrets/read_token. Scope them per agent (see README).
secrets:
  coordinator-write:      { file: ./secrets/coordinator/write-token }
  coordinator-read:       { file: ./secrets/coordinator/read-token }
  core-write:             { file: ./secrets/core/write-token }
  core-read:              { file: ./secrets/core/read-token }
  scale-write:            { file: ./secrets/scale/write-token }
  scale-read:             { file: ./secrets/scale/read-token }
  consumer-metrics-write: { file: ./secrets/consumer-metrics/write-token }
  consumer-metrics-read:  { file: ./secrets/consumer-metrics/read-token }

networks:
  internal:
    internal: true      # no route to the outside world
  egress: {}            # only the proxy joins this

volumes:
  # Each agent's clone of its own repository.
  work-coordinator:
  work-core:
  work-scale:
  work-consumer-metrics:
  # Claude Code login and history, shared by every agent but kept apart from
  # your own Claude configuration. History doesn't mix: Claude files it by
  # working directory, and each agent works in its own /workspace/<repo>.
  claude-agents:
  # elan and its toolchains, shared with every other project on this machine
  # that mounts elan-shared, so a toolchain is downloaded once per machine.
  # External, so that `docker compose down -v` leaves it alone; scripts/up.sh
  # and each agent's devcontainer.json create it if it is missing.
  elan-shared:
    external: true
